{{/* Dual CTA — 정보성 CTA only (전환성 CTA 폐기, v2) */}}
<div class="max-w-2xl mx-auto my-8 p-6 bg-neutral-50 dark:bg-neutral-800 rounded-xl border border-neutral-200 dark:border-neutral-700">
  <p class="text-lg font-semibold mb-2">{{ .Get "info_title" }}</p>
  <p class="text-sm text-neutral-600 dark:text-neutral-400 mb-4">{{ .Get "info_desc" }}</p>
  <a href="{{ .Get "info_url" }}" class="inline-block w-full text-center px-4 py-3 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 transition-opacity">
    {{ .Get "info_cta" | default "더 알아보기 →" }}
  </a>
</div>
