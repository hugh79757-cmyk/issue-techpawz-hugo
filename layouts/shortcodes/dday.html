<div class="dday-outer">
  <div class="dday-card">

    <h2 class="dday-title">💗 커플 디데이 계산기 💗</h2>

    <div class="dday-input-group">
      <label class="dday-label" for="startdate">사귀기 시작한 날</label>
      <input type="date" id="startdate" class="dday-date-input">
    </div>

    <button class="dday-btn" onclick="calculateLoveDays()">
      오늘은 몇 일째? 💑
    </button>

    <p id="resultLoveDay" class="dday-result"></p>

    <div id="anniversaryList" class="dday-anniversary"></div>

    <div id="shareLink" class="dday-share"></div>

  </div>
</div>

<script>
function calculateLoveDays() {
  const inputDate = document.getElementById("startdate").value;
  const result = document.getElementById("resultLoveDay");
  const anniversary = document.getElementById("anniversaryList");
  const share = document.getElementById("shareLink");

  if (!inputDate) {
    result.innerText = "사귄 날짜를 먼저 입력해 주세요!";
    return;
  }

  const [sy, sm, sd] = inputDate.split('-').map(Number);
  const start = new Date(sy, sm - 1, sd);

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const diffTime = today - start;
  const days = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;

  result.innerHTML = `우리가 사귄 지<br><span class="dday-days">${days}일째</span><br>되는 날이에요 💕`;

  const milestones = [100, 200, 300, 365, 500, 1000];
  const icons = { 100: '🌸', 200: '💐', 300: '🌹', 365: '🎂', 500: '💎', 1000: '👑' };
  let html = '<p class="dday-anniversary-title">✨ 기념일 미리보기</p>';

  milestones.forEach(day => {
    const future = new Date(start.getTime() + (day - 1) * 86400000);
    const y = future.getFullYear();
    const m = String(future.getMonth() + 1).padStart(2, '0');
    const d = String(future.getDate()).padStart(2, '0');
    const isPast = future < today;
    html += `
      <div class="dday-anniversary-item${isPast ? ' dday-past' : ''}">
        <span class="dday-ann-icon">${icons[day]}</span>
        <span class="dday-ann-day">${day}일</span>
        <span class="dday-ann-date">${y}-${m}-${d}</span>
        ${isPast ? '<span class="dday-ann-badge">완료</span>' : ''}
      </div>`;
  });

  anniversary.innerHTML = html;

  const link = window.location.href.split('?')[0] + '?date=' + encodeURIComponent(inputDate);

  share.innerHTML = `
    <div class="dday-share-inner">
      <p class="dday-share-title">🔗 공유하기</p>
      <input type="text" id="copyLink" value="${link}" readonly class="dday-share-input">
      <button onclick="copyToClipboard()" class="dday-copy-btn">📋 링크 복사</button>
      <p id="copyMsg" class="dday-copy-msg"></p>
    </div>
  `;

  for (let i = 0; i < 12; i++) {
    const heart = document.createElement('div');
    heart.innerHTML = ['💖', '💕', '❤️', '💗', '💓'][Math.floor(Math.random() * 5)];
    const startTop = window.innerHeight * (0.6 + Math.random() * 0.4);
    Object.assign(heart.style, {
      position: 'fixed',
      top: startTop + 'px',
      left: Math.random() * window.innerWidth + 'px',
      fontSize: Math.random() * 20 + 20 + 'px',
      pointerEvents: 'none',
      zIndex: '9999',
      opacity: '0.85',
      animation: 'heartFloat 3s ease-out forwards'
    });
    document.body.appendChild(heart);
    setTimeout(() => { if (heart.parentNode) heart.parentNode.removeChild(heart); }, 3000);
  }
}

function copyToClipboard() {
  const input = document.getElementById("copyLink");
  navigator.clipboard.writeText(input.value).then(() => {
    document.getElementById("copyMsg").innerText = "복사 완료!";
  }).catch(() => {
    document.getElementById("copyMsg").innerText = "복사에 실패했어요. 직접 선택해서 복사해 주세요.";
  });
}

window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const dateParam = params.get('date');

  if (dateParam) {
    document.getElementById("startdate").value = dateParam;
    calculateLoveDays();
  }
});
</script>
